server:
  port: 8443
  forward-headers-strategy: native
spring:
  application:
    name: api-gateway
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/alarm}
    username: ${DB_USER:alarm}
    password: ${DB_PASSWORD:alarm}
  flyway:
    enabled: true
    locations: classpath:db/migration
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER_URI:http://localhost:8444/realms/alarm}
          jwk-set-uri: ${OIDC_JWKS_URI:http://localhost:8444/realms/alarm/protocol/openid-connect/certs}
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
opa:
  url: ${OPA_URL:http://localhost:8181/v1/data/alarm/authz}
reports:
  dir: ${REPORTS_DIR:artifacts}
  schedule:
    enabled: true
    cron: "0 5 0 * * *"
    format: pdf
